<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Rue des Compétences · CAP EPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --ink:#1D2433; --muted:#566074; --line:#D3DBE6;
  --street:#2E3A4F; --pave:#46546C;
  --b1:#D99A00; --b1-soft:#FFF3CC; --b2:#0E9C92; --b2-soft:#D6F2EF; --b3:#D9434F; --b3-soft:#FCE1E3; --b4:#6A4FD3; --b4-soft:#E9E4FB;
  --ok:#1E8F4E; --ok-soft:#DBF3E5; --ko:#C23434; --ko-soft:#FADFDF; --focus:#2F63D0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131924; --surface:#1D2532; --ink:#E9EFF7; --muted:#A4AFC3; --line:#334056;
    --street:#0C1118; --pave:#222C3B;
    --b1-soft:#3A2F0E; --b2-soft:#0E3330; --b3-soft:#3D1A1F; --b4-soft:#2A2350; --ok-soft:#113220; --ko-soft:#3A1616;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131924; --surface:#1D2532; --ink:#E9EFF7; --muted:#A4AFC3; --line:#334056;
  --street:#0C1118; --pave:#222C3B;
  --b1-soft:#3A2F0E; --b2-soft:#0E3330; --b3-soft:#3D1A1F; --b4-soft:#2A2350; --ok-soft:#113220; --ko-soft:#3A1616;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font:400 17px/1.55 "Atkinson Hyperlegible", "Verdana", sans-serif; }
h1,h2,h3{ font-family:"Fredoka","Trebuchet MS",sans-serif; font-weight:600; line-height:1.2; margin:0 0 .5em; }
h1{ font-size:1.9rem; } h2{ font-size:1.45rem; } h3{ font-size:1.15rem; }
p{ margin:0 0 .8em; }
button,input,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
.wrap{ max-width:1080px; margin:0 auto; padding:16px; }
.narrow{ max-width:720px; margin:0 auto; }

/* Barre du haut */
.top{ background:var(--street); color:#fff; }
.top .wrap{ display:flex; align-items:center; gap:12px; padding-top:12px; padding-bottom:12px; flex-wrap:wrap; }
.brand{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:1.25rem; margin-right:auto; display:flex; align-items:center; gap:8px; }
.brand span{ font-size:1.4rem; }
.pill{ background:rgba(255,255,255,.14); border-radius:999px; padding:4px 12px; font-size:.95rem; }
.btn{ border:2px solid transparent; border-radius:12px; padding:10px 18px; background:var(--street); color:#fff; font-weight:700; }
.btn:hover{ filter:brightness(1.12); }
.btn:disabled{ opacity:.45; cursor:not-allowed; filter:none; }
.btn.ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
.top .btn.ghost{ color:#fff; border-color:rgba(255,255,255,.35); padding:6px 14px; }
.btn.big{ padding:14px 24px; font-size:1.1rem; }
.link{ background:none; border:none; color:var(--muted); text-decoration:underline; padding:4px; }

.card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px; }
.muted{ color:var(--muted); }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

/* Connexion */
.login{ min-height:100%; display:grid; place-items:center; padding:24px 16px; }
.login .card{ max-width:440px; width:100%; }
.field{ display:block; margin:14px 0; }
.field input{ width:100%; padding:12px 14px; border-radius:12px; border:2px solid var(--line); background:var(--bg); }
.hint{ font-size:.9rem; color:var(--muted); }
.error{ color:var(--ko); font-weight:700; min-height:1.4em; }

/* La rue */
.street{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-items:start; margin-top:12px; }
.shop{ background:var(--surface); border:2px solid var(--line); border-radius:6px 6px 14px 14px; overflow:hidden; }
.awning{ height:44px; position:relative;
  background:repeating-linear-gradient(90deg, var(--c) 0 28px, #fff 28px 56px); }
.awning::after{ content:""; position:absolute; left:0; right:0; bottom:-14px; height:14px;
  background:radial-gradient(circle at 14px 0, var(--c) 13px, transparent 14px) 0 0/28px 14px repeat-x; }
.shop .sign{ padding:24px 16px 10px; text-align:center; }
.shop .sign h2{ margin:0; font-size:1.3rem; }
.shop .sign p{ margin:4px 0 0; font-size:.92rem; color:var(--muted); }
.doors{ padding:8px 12px 14px; display:grid; gap:8px; }
.door{ text-align:left; width:100%; border:2px solid var(--line); background:var(--bg); border-radius:12px; padding:10px 12px; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; align-items:center; }
.door:hover:not(:disabled){ border-color:var(--c); }
.door .code{ grid-row:span 2; font-family:"Fredoka",sans-serif; font-weight:700; background:var(--soft); color:var(--ink); border-radius:8px; padding:4px 8px; min-width:44px; text-align:center; }
.door .t{ font-weight:700; line-height:1.3; }
.door .s{ font-size:.85rem; color:var(--muted); display:flex; gap:6px; align-items:center; }
.door:disabled{ cursor:default; opacity:.6; }
.dots{ display:inline-flex; gap:4px; }
.dot{ width:11px; height:11px; border-radius:50%; border:2px solid var(--c); }
.dot.on{ background:var(--c); }
.door.full{ border-color:var(--c); background:var(--soft); }
.pavement{ height:26px; margin-top:22px; border-radius:8px; background:repeating-linear-gradient(90deg,var(--pave) 0 60px,var(--street) 60px 64px); }

/* Tremplin */
.tremplin{ margin-top:26px; }
.tremplin .doors{ grid-template-columns:repeat(2,1fr); }
.invite{ margin-top:26px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; border:2px dashed var(--b4); background:var(--b4-soft); border-radius:18px; padding:18px 20px; }
.invite p{ margin:0; flex:1 1 300px; }
.btn.violet{ background:var(--b4); }
@media (max-width:820px){ .tremplin .doors{ grid-template-columns:1fr; } }
/* Compétence */
.back{ margin:8px 0 14px; }
.exo{ display:flex; gap:14px; align-items:center; width:100%; text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:16px; padding:16px; margin-bottom:12px; }
.exo:hover{ border-color:var(--c); }
.exo .ic{ font-size:1.8rem; width:52px; height:52px; display:grid; place-items:center; border-radius:14px; background:var(--soft); flex:none; }
.exo .t{ font-weight:700; font-size:1.05rem; }
.exo .s{ font-size:.9rem; color:var(--muted); }
.exo .st{ margin-left:auto; font-weight:700; white-space:nowrap; }
.tag-ok{ color:var(--ok); } .tag-wait{ color:var(--b1); }
.comment{ background:var(--b2-soft); border-radius:12px; padding:10px 14px; margin:-4px 0 14px; font-size:.95rem; }

/* Jeu */
.progress{ height:10px; background:var(--line); border-radius:99px; overflow:hidden; margin:6px 0 18px; }
.progress div{ height:100%; background:var(--c); transition:width .3s; }
.ctx{ background:var(--soft); border-radius:12px; padding:12px 14px; margin-bottom:14px; }
.q{ font-size:1.2rem; font-weight:700; margin-bottom:16px; }
.opts{ display:grid; gap:10px; }
.opt{ text-align:left; padding:14px 16px; border-radius:12px; border:2px solid var(--line); background:var(--surface); font-weight:700; }
.opt:hover:not(:disabled){ border-color:var(--c); }
.opt.good{ background:var(--ok-soft); border-color:var(--ok); }
.opt.bad{ background:var(--ko-soft); border-color:var(--ko); }
.opt:disabled{ cursor:default; }
.vf{ grid-template-columns:1fr 1fr; }
.vf .opt{ text-align:center; font-size:1.2rem; padding:20px; }
.timer{ height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin-bottom:14px; }
.timer div{ height:100%; background:var(--b1); width:100%; }
.num{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.num input{ width:150px; font-size:1.3rem; padding:10px 12px; border-radius:12px; border:2px solid var(--line); background:var(--bg); text-align:right; }
.fb{ margin-top:16px; border-radius:14px; padding:14px 16px; }
.fb.ok{ background:var(--ok-soft); } .fb.ko{ background:var(--ko-soft); }
.fb strong{ display:block; margin-bottom:4px; }
table.doc{ width:100%; border-collapse:collapse; font-size:.95rem; background:var(--surface); border-radius:8px; overflow:hidden; }
table.doc th, table.doc td{ border:1px solid var(--line); padding:6px 8px; text-align:left; }
table.doc th{ background:var(--bg); }
.result{ text-align:center; }
.score{ font-family:"Fredoka",sans-serif; font-size:4rem; font-weight:700; line-height:1; margin:10px 0; color:var(--c); }
.badge{ display:inline-flex; gap:10px; align-items:center; background:var(--soft); border:2px dashed var(--c); border-radius:16px; padding:10px 16px; margin:10px 0 16px; font-weight:700; }

/* Rédaction */
.steps{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.steps span{ font-size:.85rem; padding:4px 10px; border-radius:99px; background:var(--line); color:var(--muted); }
.steps span.on{ background:var(--c); color:#fff; }
.redac{ display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start; }
textarea{ width:100%; min-height:300px; border-radius:14px; border:2px solid var(--line); background:var(--surface); padding:14px; line-height:1.6; resize:vertical; }
.method ol{ padding-left:22px; margin:0 0 12px; }
.method li{ margin-bottom:6px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ border:2px solid var(--c); background:var(--soft); border-radius:99px; padding:5px 12px; font-size:.9rem; }
.check{ display:flex; gap:12px; align-items:flex-start; padding:12px; border-radius:12px; border:2px solid var(--line); margin-bottom:8px; background:var(--surface); cursor:pointer; }
.check input{ width:22px; height:22px; margin-top:2px; flex:none; }
.compare{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.paper{ white-space:pre-wrap; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; font-size:.97rem; }
ul.list{ margin:6px 0 10px; padding-left:20px; }

/* Jeux */
.jeu{ background:var(--c); color:#fff; border-radius:6px; padding:1px 6px; font-weight:700; font-size:.78rem; }
.hud{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; font-weight:700; margin:4px 0 12px; }
.ticket{ display:flex; gap:20px; flex-wrap:wrap; font-size:1.15rem; background:var(--soft); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
.tray{ border:2px dashed var(--line); border-radius:12px; padding:10px 12px; margin-bottom:12px; min-height:64px; }
.given{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.mini{ border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:2px 8px; font-size:.85rem; }
.money{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; }
.coin{ width:58px; height:58px; border-radius:50%; border:3px solid #B8860B; background:radial-gradient(circle at 35% 30%,#FFE9A6,#E2B13C); color:#3B2A00; font-weight:700; font-size:.85rem; }
.coin.c1,.coin.c2,.coin.c5{ border-color:#8A4B25; background:radial-gradient(circle at 35% 30%,#F3B98C,#B8693A); color:#fff; width:48px; height:48px; }
.coin.c100,.coin.c200{ border-color:#9A9A9A; background:radial-gradient(circle at 35% 30%,#FFF4C2,#D9B44A); }
.bill{ min-width:84px; height:52px; border-radius:6px; border:2px solid rgba(0,0,0,.2); font-weight:700; color:#1D2433; }
.b500{ background:#C9D3DD; } .b1000{ background:#F2B9B5; } .b2000{ background:#A9C8F0; } .b5000{ background:#F6C68A; }
.money button:disabled{ opacity:.5; cursor:default; }
.shelf{ border:3px solid var(--street); border-radius:10px; overflow:hidden; margin:10px 0 14px; }
.lvl{ display:grid; grid-template-columns:130px 1fr; border-bottom:6px solid var(--street); min-height:64px; cursor:pointer; background:var(--surface); }
.lvl:last-child{ border-bottom:none; }
.lvl:hover{ background:var(--soft); }
.lvlname{ background:var(--bg); padding:8px; font-weight:700; font-size:.88rem; display:flex; align-items:center; }
.slot{ display:flex; flex-wrap:wrap; gap:6px; padding:8px; align-content:center; }
.prod{ border:2px solid var(--line); background:var(--surface); border-radius:10px; padding:6px 10px; font-weight:700; font-size:.9rem; }
.prod.sel{ border-color:var(--c); background:var(--soft); box-shadow:0 0 0 3px var(--c); }
.prod.good{ background:var(--ok-soft); border-color:var(--ok); } .prod.bad{ background:var(--ko-soft); border-color:var(--ko); }
.tray2{ display:flex; flex-wrap:wrap; gap:8px; }
.recap{ background:var(--bg); border-radius:12px; padding:12px 14px; margin-top:12px; text-align:left; font-size:.95rem; }
.recap p{ margin:0 0 6px; }
.belt{ height:150px; border-radius:12px; display:grid; place-items:center; margin-bottom:10px;
  background:repeating-linear-gradient(90deg,var(--pave) 0 30px,var(--street) 30px 34px); background-size:68px 100%; animation:belt 1s linear infinite; }
@keyframes belt{ to{ background-position:68px 0; } }
.item{ background:var(--surface); border-radius:14px; padding:10px 18px; display:flex; flex-direction:column; align-items:center; gap:2px; box-shadow:0 6px 16px rgba(0,0,0,.25); }
.item .big{ font-size:2.4rem; line-height:1; }
.opts.tapis{ grid-template-columns:repeat(3,1fr); }
.opts.tapis .opt{ text-align:center; }
.hunt .hot{ width:100%; text-align:left; }
.hot{ border:1px dashed transparent; background:none; padding:4px 6px; border-radius:6px; }
.hot:hover{ border-color:var(--c); }
.hot.found{ background:var(--ok-soft); border-color:var(--ok); }
.labels{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; }
.hot.label{ background:#FFFDF2; color:#1D2433; border:2px solid #D9D2B0; border-radius:8px; padding:10px; text-align:left; line-height:1.4; }
.hot.label.found{ background:var(--ok-soft); color:var(--ink); border-color:var(--ok); }
.shake{ animation:shake .4s; background:var(--ko-soft) !important; }
@keyframes shake{ 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
.gauge{ display:inline-block; width:140px; height:12px; background:var(--line); border-radius:99px; overflow:hidden; }
.gauge span{ display:block; height:100%; background:linear-gradient(90deg,var(--ko),var(--b1),var(--ok)); background-size:140px 100%; transition:width .4s; }
.chat{ display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto; margin-bottom:12px; }
.msg{ max-width:85%; padding:10px 14px; border-radius:16px; }
.msg.cli{ background:var(--bg); align-self:flex-start; border-bottom-left-radius:4px; }
.msg.me{ background:var(--c); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
.msg.narr{ align-self:center; font-style:italic; color:var(--muted); text-align:center; }
.ending{ background:var(--soft); border-radius:14px; padding:14px 16px; margin:12px 0; text-align:left; }
.mem{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.mcard{ min-height:110px; border-radius:14px; border:2px solid var(--line); background:var(--c); color:#fff; padding:8px; font-size:.9rem; }
.mcard .back{ font-family:"Fredoka",sans-serif; font-size:2rem; }
.mcard .front{ display:none; }
.mcard.on, .mcard.done{ background:var(--surface); color:var(--ink); }
.mcard.on .back, .mcard.done .back{ display:none; }
.mcard.on .front, .mcard.done .front{ display:block; }
.mcard .term{ font-weight:700; font-size:1rem; }
.mcard.done{ border-color:var(--ok); background:var(--ok-soft); }
@media (max-width:620px){ .mem{ grid-template-columns:repeat(3,1fr); } .lvl{ grid-template-columns:90px 1fr; } .opts.tapis{ grid-template-columns:1fr; } .coin{ width:50px; height:50px; } }
@media (prefers-reduced-motion: reduce){ .belt{ animation:none; } }

.toastg{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(30px); background:var(--street); color:#fff; padding:12px 18px; border-radius:12px; opacity:0; transition:.3s; z-index:50; max-width:90%; text-align:center; pointer-events:none; }
.toastg.on{ opacity:1; transform:translateX(-50%) translateY(0); }
.codes{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
.codecard{ border:2px dashed var(--line); border-radius:12px; padding:12px 14px; background:var(--surface); }
.codecard .cd{ font-family:"Fredoka",sans-serif; font-size:1.6rem; letter-spacing:.12em; }
@media print{ .top, .noprint{ display:none !important; } body{ background:#fff; color:#000; } .codecard{ break-inside:avoid; border-color:#999; } }
/* Enseignant */
.tablewrap{ overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--surface); }
table.grid{ border-collapse:collapse; width:100%; font-size:.92rem; }
table.grid th, table.grid td{ padding:8px 6px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap; }
table.grid th:first-child, table.grid td:first-child{ text-align:left; padding-left:14px; }
table.grid tbody tr{ cursor:pointer; }
table.grid tbody tr:hover{ background:var(--bg); }
.cell{ display:inline-block; min-width:38px; padding:3px 6px; border-radius:8px; font-weight:700; }
.c-none{ color:var(--muted); }
.c-part{ background:var(--b1-soft); }
.c-full{ background:var(--ok-soft); color:var(--ok); }
.c-off{ color:var(--line); }
.legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:.9rem; margin:10px 0 18px; color:var(--muted); }
.att{ display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
.att:last-child{ border-bottom:none; }
.redbox{ border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; background:var(--bg); }
.redbox textarea{ min-height:70px; margin:8px 0; }
.demo{ font-size:.85rem; background:var(--b1-soft); border-radius:12px; padding:10px 14px; margin-bottom:16px; }

@media (max-width:820px){
  .street{ grid-template-columns:1fr; }
  .redac, .compare{ grid-template-columns:1fr; }
  textarea{ min-height:220px; }
  h1{ font-size:1.6rem; }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== Contenus ===================== */
const BLOCS = {
  1:{ name:"Côté réserve", sub:"Bloc 1 · Recevoir et suivre les commandes", c:"var(--b1)", soft:"var(--b1-soft)" },
  2:{ name:"Côté rayon", sub:"Bloc 2 · Mettre en valeur et approvisionner", c:"var(--b2)", soft:"var(--b2-soft)" },
  3:{ name:"Côté client", sub:"Bloc 3 · Conseiller et accompagner le client", c:"var(--b3)", soft:"var(--b3-soft)" },
  4:{ name:"Le tremplin 2nde MRC", sub:"Prendre de l'avance pour ton entrée en Seconde Bac Pro Métiers de la relation client", c:"var(--b4)", soft:"var(--b4-soft)" }
};
const COMPS = [
  {id:"1.1",b:1,t:"Participer à la passation des commandes fournisseurs"},
  {id:"1.2",b:1,t:"Réceptionner"},
  {id:"1.3",b:1,t:"Stocker"},
  {id:"1.4",b:1,t:"Préparer les commandes clients"},
  {id:"2.1",b:2,t:"Approvisionner, mettre en rayon et ranger"},
  {id:"2.2",b:2,t:"Mettre en valeur les produits et l'espace"},
  {id:"2.3",b:2,t:"Participer au conditionnement"},
  {id:"2.4",b:2,t:"Installer et mettre à jour la signalétique"},
  {id:"2.5",b:2,t:"Lutter contre la démarque, participer à l'inventaire"},
  {id:"3.1",b:3,t:"Préparer son environnement de travail"},
  {id:"3.2",b:3,t:"Prendre contact avec le client"},
  {id:"3.3",b:3,t:"Accompagner le parcours client omnicanal"},
  {id:"3.4",b:3,t:"Finaliser la prise en charge du client"},
  {id:"3.5",b:3,t:"Recevoir les réclamations courantes"},
  {id:"T1",b:4,t:"Découvrir l'omnicanal"},
  {id:"T2",b:4,t:"Suivre la relation client"},
  {id:"T3",b:4,t:"Collecter et exploiter l'information"},
  {id:"T4",b:4,t:"Les méthodes du lycée pro"}
];
const CATS = ["Conforme","Produit manquant","Produit non commandé","Erreur de référence","Produit abîmé"];
function triRow(ref,p,c,l){

async function flush(){
  if(flushing) return; flushing = true;
  while(QUEUE.length){
    const [fn, args] = QUEUE[0];
    try{ const ok = await rpc(fn, args); QUEUE.shift(); if(ok === false) toast("Ton code n'est plus reconnu : préviens ton enseignante."); }
    catch(e){ toast("⚠️ Connexion perdue : ton résultat sera envoyé dès que possible."); flushing = false; setTimeout(flush, 15000); return; }
  }
  flushing = false;
}

const ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newCode(){ const a = new Uint32Array(6); crypto.getRandomValues(a); return Array.from(a, x => ALPHA[x % ALPHA.length]).join(""); }
async function fetchAll(table){
  let out = [], from = 0;
  while(true){ const { data, error } = await sb.from(table).select("*").order("created_at").range(from, from+999); if(error) throw error; out = out.concat(data); if(data.length < 1000) break; from += 1000; }
  return out;
}

function best(name, id){
  const st = DB.students[name]; if(!st) return null;
  const a = st.attempts.filter(x => x.exoId === id); if(!a.length) return null;
  return Math.max(...a.map(x => Math.round(x.score / x.total * 100)));
}
function redacOf(name, id){ const st = DB.students[name]; if(!st) return null; const r = st.redacs.filter(x => x.exoId === id); return r.length ? r[r.length-1] : null; }

  }

/* ----- Jeux ----- */
let G = null;
function startExo(id){
  const f = findExo(id); if(!f) return;
  stopTimer();
  if(f.exo.game) return GAMES[f.exo.game.type](f.exo, f.comp);
  if(f.exo.redac){ R = { exo:f.exo, comp:f.comp, phase:1, text:"", checks:[], help:false }; return viewRedac(); }
  G = { exo:f.exo, comp:f.comp, i:0, score:0, answered:false };
  viewStep();
}
function viewStep(){
  stopTimer();
  const c = compById(G.comp), st = G.exo.steps[G.i], n = G.exo.steps.length;
  let html = userBar()+'<main class="wrap narrow" style="'+setC(c.b)+'"><div class="row" style="justify-content:space-between"><button class="btn ghost back" id="bk">Quitter la mission</button><strong>'+G.exo.icon+' '+G.exo.title+'</strong></div>'+
    '<div class="muted">Question '+(G.i+1)+' sur '+n+'</div><div class="progress"><div style="width:'+(G.i/n*100)+'%"></div></div><div class="card">';
  if(st.ctx) html += '<div class="ctx">'+st.ctx+'</div>';
  if(st.k === "vf") html += '<div class="timer"><div id="tm"></div></div>';
  html += '<div class="q">'+st.q+'</div>';
  if(st.k === "qcm" || st.k === "tri"){
    html += '<div class="opts">'+st.o.map((o,i) => '<button class="opt" data-i="'+i+'">'+o+'</button>').join('')+'</div>';
  } else if(st.k === "vf"){
    html += '<div class="opts vf"><button class="opt" data-v="1">Vrai</button><button class="opt" data-v="0">Faux</button></div>';
  } else if(st.k === "num"){
    html += '<div class="num"><input id="nv" inputmode="decimal" autocomplete="off" aria-label="Ta réponse"><strong>'+(st.u||"€")+'</strong><button class="btn" id="nk">Valider</button></div>';
  }
  html += '<div id="fb"></div></div></main>';
  app.innerHTML = html; bindOut();
  document.getElementById("bk").onclick = () => viewComp(G.comp);
  G.answered = false;
  if(st.k === "qcm" || st.k === "tri") app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  if(st.k === "vf"){
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b.dataset.v === "1"));
    let left = 100; const bar = document.getElementById("tm");
    timerId = setInterval(() => { left -= 1; if(bar) bar.style.width = left+"%"; if(left <= 0){ stopTimer(); answer(null); } }, 100);
  }
  if(st.k === "num"){
    const inp = document.getElementById("nv"); inp.focus();
    const go = () => { const v = parseFloat(inp.value.replace(/\s|€|%/g,"").replace(",", ".")); if(isNaN(v)){ inp.focus(); return; } answer(v); };
    document.getElementById("nk").onclick = go; inp.onkeydown = e => { if(e.key === "Enter") go(); };
  }
}
function answer(v){
  if(G.answered) return; G.answered = true; stopTimer();
  const st = G.exo.steps[G.i]; let ok, goodLabel;
  if(st.k === "qcm" || st.k === "tri"){
    ok = v === st.a; goodLabel = st.o[st.a];
    app.querySelectorAll(".opt").forEach(b => { b.disabled = true; const i = +b.dataset.i; if(i === st.a) b.classList.add("good"); else if(i === v) b.classList.add("bad"); });
  } else if(st.k === "vf"){
    ok = v === st.a; goodLabel = st.a ? "Vrai" : "Faux";
    app.querySelectorAll(".opt").forEach(b => { b.disabled = true; const bv = b.dataset.v === "1"; if(bv === st.a) b.classList.add("good"); else if(v !== null && bv === v) b.classList.add("bad"); });
  } else {
    ok = Math.abs(v - st.a) < 0.005; goodLabel = fmt(st.a)+" "+(st.u||"€");
    document.getElementById("nv").disabled = true; document.getElementById("nk").disabled = true;
  }
  if(ok) G.score++;
  const last = G.i === G.exo.steps.length - 1;
  const head = ok ? "Bien vu !" : (v === null ? "Temps écoulé ! La bonne réponse : "+goodLabel : "Pas tout à fait. La bonne réponse : "+goodLabel);
  document.getElementById("fb").innerHTML = '<div class="fb '+(ok?'ok':'ko')+'"><strong>'+(ok?'✔ ':'✘ ')+head+'</strong>'+st.e+'</div>'+
    '<div style="margin-top:14px;text-align:right"><button class="btn" id="nx">'+(last?'Voir mon résultat':'Question suivante')+'</button></div>';
  const nx = document.getElementById("nx"); nx.focus();
  nx.onclick = () => { if(last) finish(); else { G.i++; viewStep(); } };
}
function finish(){ viewResult(G.exo, G.comp, G.score, G.exo.steps.length, ''); }
function viewResult(exo, comp, score, total, details){
  stopTimer();
  const pct = Math.round(score/total*100), before = compProgress(S.user, comp);
  student(S.user).attempts.push({ exoId:exo.id, comp, score, total, date:new Date().toISOString() });
  send("eleve_resultat", { p_code:S.code, p_exo:exo.id, p_comp:comp, p_score:score, p_total:total });
  const after = compProgress(S.user, comp), c = compById(comp);
  const msg = pct === 100 ? "Sans faute, bravo !" : pct >= 70 ? "Mission réussie !" : pct >= 40 ? "Pas mal ! Relis les explications et retente ta chance." : "Courage, rejoue pour progresser.";
  const badge = (after.done === after.total && before.done < before.total) ? '<div class="badge">🏅 Badge débloqué : compétence '+c.id+' complète</div><br>' : '';
  app.innerHTML = userBar()+'<main class="wrap narrow" style="'+setC(c.b)+'"><div class="card result"><h2>'+exo.icon+' '+exo.title+'</h2>'+
    '<div class="score">'+score+' / '+total+'</div><p><strong>'+msg+'</strong></p><p class="muted">+'+(score*10)+' points</p>'+badge+(details||'')+
    '<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="rj">Rejouer</button><button class="btn ghost" id="bk">Retour à la compétence</button></div></div></main>';
  bindOut();
  document.getElementById("rj").onclick = () => startExo(exo.id);
  document.getElementById("bk").onclick = () => viewComp(comp);
}

/* ----- Rédaction ----- */
let R = null;
function viewRedac(){
  stopTimer();
  const c = compById(R.comp), d = R.exo.redac;
  const labels = ["La situation","J'écris","Je vérifie","Je compare"];
  let html = userBar()+'<main class="wrap" style="'+setC(c.b)+'"><div class="row" style="justify-content:space-between"><button class="btn ghost back" id="bk">Quitter la mission</button><strong>'+R.exo.icon+' '+R.exo.title+'</strong></div>'+
    '<div class="steps">'+labels.map((l,i) => '<span class="'+(i+1===R.phase?'on':'')+'">'+(i+1)+'. '+l+'</span>').join('')+'</div>';
  const infos = '<ul class="list">'+d.infos.map(x => '<li>'+x+'</li>').join('')+'</ul>';
  if(R.phase === 1){
    html += '<div class="card narrow"><h2>La situation</h2><p>'+d.situation+'</p>'+infos+
      '<div style="text-align:right"><button class="btn" id="nx">J\'ai compris, j\'écris</button></div></div>';
  } else if(R.phase === 2){
    html += '<div class="redac"><div><textarea id="tx" maxlength="6000" placeholder="Écris ton texte ici…">'+esc(R.text)+'</textarea>'+
      '<div class="row" style="justify-content:space-between;margin-top:10px"><span class="muted" id="cnt"></span><button class="btn" id="nx">J\'ai terminé, je vérifie</button></div></div>'+
      '<aside class="card method"><h3>📋 La méthode</h3><ol>'+d.method.map(x => '<li>'+x+'</li>').join('')+'</ol>'+
      (R.help ? '<h3>💡 Des débuts de phrases</h3><p class="hint">Touche une phrase pour l\'ajouter à ton texte.</p><div class="chips">'+d.amorces.map((a,i) => '<button class="chip" data-a="'+i+'">'+esc(a)+'</button>').join('')+'</div>' : '<button class="btn ghost" id="help">💡 Besoin d\'un coup de pouce ?</button>')+
      '<h3 style="margin-top:16px">Rappel</h3>'+infos+'</aside></div>';
  } else if(R.phase === 3){
    html += '<div class="card narrow"><h2>Je vérifie mon texte</h2><p class="muted">Relis ton texte et coche chaque case seulement si c\'est vrai.</p>'+
      d.checks.map((x,i) => '<label class="check"><input type="checkbox" data-k="'+i+'"'+(R.checks[i]?' checked':'')+'><span>'+x+'</span></label>').join('')+
      '<div class="paper" style="margin:14px 0">'+esc(R.text)+'</div>'+
      '<div class="row" style="justify-content:space-between"><button class="btn ghost" id="pv">Corriger mon texte</button><button class="btn" id="nx">Envoyer et voir la réponse modèle</button></div></div>';
  } else {
    html += '<div class="card"><h2>Je compare</h2><p>Ton texte est envoyé à ton enseignante. Compare-le avec la réponse modèle : qu\'as-tu oublié ? qu\'as-tu dit autrement ?</p>'+
      '<div class="compare"><div><h3>Mon texte</h3><div class="paper">'+esc(R.text)+'</div></div><div><h3>La réponse modèle</h3><div class="paper">'+esc(d.modele)+'</div></div></div>'+
      '<div style="text-align:right;margin-top:16px"><button class="btn" id="nx">Retour à la compétence</button></div></div>';
  }
  html += '</main>';
  app.innerHTML = html; bindOut();
  document.getElementById("bk").onclick = () => viewComp(R.comp);
  const nx = document.getElementById("nx");
  if(R.phase === 1) nx.onclick = () => { R.phase = 2; viewRedac(); };
  if(R.phase === 2){
    const tx = document.getElementById("tx"), cnt = document.getElementById("cnt");
    const upd = () => { R.text = tx.value; const w = tx.value.trim() ? tx.value.trim().split(/\s+/).length : 0; cnt.textContent = w+" mots"; nx.disabled = w < 15; };
    tx.oninput = upd; upd(); tx.focus();
    app.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
      const a = d.amorces[+ch.dataset.a], s = tx.selectionStart, e = tx.selectionEnd, v = tx.value;
      const pre = v.slice(0,s), sep = pre && !/\n$/.test(pre) ? "\n" : "";
      tx.value = pre + sep + a + " " + v.slice(e); const pos = (pre+sep+a+" ").length;
      tx.focus(); tx.setSelectionRange(pos,pos); upd();
    });
    nx.onclick = () => { R.phase = 3; viewRedac(); };
    const hp = document.getElementById("help"); if(hp) hp.onclick = () => { R.text = tx.value; R.help = true; viewRedac(); };
  }
  if(R.phase === 3){
    const boxes = app.querySelectorAll("input[type=checkbox]");
    const upd = () => { boxes.forEach(b => R.checks[+b.dataset.k] = b.checked); nx.disabled = !d.checks.every((_,i) => R.checks[i]); };
    boxes.forEach(b => b.onchange = upd); upd();
    document.getElementById("pv").onclick = () => { R.phase = 2; viewRedac(); };
    nx.onclick = () => {
      student(S.user).redacs.push({ exoId:R.exo.id, comp:R.comp, text:R.text, help:R.help, date:new Date().toISOString(), status:"à lire", comment:"" });
      send("eleve_redaction", { p_code:S.code, p_exo:R.exo.id, p_comp:R.comp, p_texte:R.text.slice(0,6000), p_aide:!!R.help });
      R.phase = 4; viewRedac();
    };
  }
  if(R.phase === 4) nx.onclick = () => viewComp(R.comp);
}

let GT = null, GTO = null;
function stopAll(){ stopTimer(); if(GT){ clearInterval(GT); GT = null; } if(GTO){ clearTimeout(GTO); GTO = null; } }
const shuffle = a => { const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; } return b; };
const euro = c => (c/100).toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";

function shell(exo, comp){
  const c = compById(comp);
  app.innerHTML = userBar()+'<main class="wrap narrow game" style="'+setC(c.b)+'"><div class="row" style="justify-content:space-between"><button class="btn ghost back" id="bk">Quitter le jeu</button><strong>'+exo.icon+' '+exo.title+'</strong></div><div class="hud" id="hud"></div><div id="gm"></div></main>';
  bindOut();
  document.getElementById("bk").onclick = () => { stopAll(); viewComp(comp); };
  return { gm:document.getElementById("gm"), hud:document.getElementById("hud") };
}
function intro(gm, title, rules, go){
  gm.innerHTML = '<div class="card"><h2>'+title+'</h2>'+rules+'<div style="text-align:right;margin-top:14px"><button class="btn big" id="st">C\'est parti !</button></div></div>';
  document.getElementById("st").onclick = go;
}

/* ---------- La caisse rapide ---------- */
const DENOMS = [5000,2000,1000,500,200,100,50,20,10,5,2,1];
const dLab = c => c >= 100 ? (c/100)+" €" : c+" c";
function minPieces(c){ let n = 0; for(const d of DENOMS){ n += Math.floor(c/d); c %= d; } return n; }
function gCaisse(exo, comp){
  const cfg = exo.game, n = cfg.clients.length; let i = 0, score = 0, given = [], left = 0, done = false; const log = [];
  const {gm, hud} = shell(exo, comp);
  intro(gm, "La caisse rapide", '<p>Le client te tend son argent. Clique sur les billets et les pièces pour lui rendre <strong>exactement</strong> sa monnaie, puis valide.</p><p>Attention : à chaque niveau, les clients sont plus pressés !</p>', () => next());
  function sum(){ return given.reduce((s,x) => s+x, 0); }
  function next(){
    stopAll(); if(i >= n) return viewResult(exo, comp, score, n, recap());
    const cl = cfg.clients[i]; given = []; done = false; left = cl.time*10;
    hud.innerHTML = '<span>Client '+(i+1)+' / '+n+'</span><span>Niveau '+cl.lv+'</span><span>✔ '+score+'</span>';
    gm.innerHTML = '<div class="card"><div class="timer"><div id="tm"></div></div>'+
      '<div class="ticket"><div>🧾 Ticket : <strong>'+euro(cl.t)+'</strong></div><div>💶 Le client donne : <strong>'+euro(cl.g)+'</strong></div></div>'+
      '<div class="tray"><span class="muted">Tu rends :</span> <strong id="sm">0,00 €</strong><div id="gv" class="given"></div></div>'+
      '<div class="money">'+DENOMS.map(d => '<button class="'+(d>=500?'bill b'+d:'coin c'+d)+'" data-d="'+d+'">'+dLab(d)+'</button>').join('')+'</div>'+
      '<div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn ghost" id="cl">Tout reprendre</button><button class="btn" id="ok">Rendre la monnaie</button></div><div id="fb"></div></div>';
    const draw = () => { document.getElementById("sm").textContent = euro(sum()); document.getElementById("gv").innerHTML = given.map((d,k) => '<button class="mini" data-k="'+k+'" title="Reprendre">'+dLab(d)+'</button>').join(''); 
      gm.querySelectorAll(".mini").forEach(b => b.onclick = () => { if(done) return; given.splice(+b.dataset.k,1); draw(); }); };
    gm.querySelectorAll(".money button").forEach(b => b.onclick = () => { if(done) return; given.push(+b.dataset.d); draw(); });
    document.getElementById("cl").onclick = () => { if(done) return; given = []; draw(); };
    document.getElementById("ok").onclick = () => check(false);
    draw();
    const tot = left, bar = document.getElementById("tm");
    GT = setInterval(() => { left--; bar.style.width = (left/tot*100)+"%"; if(left <= 0){ stopAll(); check(true); } }, 100);
  }
  function check(timeout){
    if(done) return; done = true; stopAll();
    const cl = cfg.clients[i], due = cl.g - cl.t, s = sum(), ok = !timeout && s === due;
    if(ok) score++;
    log.push({cl, ok, s, timeout});
    let msg = ok ? '✔ Exact ! Tu as rendu '+euro(due)+'.' : (timeout ? '⏱️ Trop tard ! ' : '✘ ')+'Il fallait rendre <strong>'+euro(due)+'</strong>'+(timeout?'':', tu as rendu '+euro(s))+'.';
    if(ok && given.length > minPieces(due)) msg += '<br>Astuce : tu pouvais le faire avec '+minPieces(due)+' pièces ou billets seulement.';
    document.getElementById("fb").innerHTML = '<div class="fb '+(ok?'ok':'ko')+'">'+msg+'</div><div style="text-align:right;margin-top:10px"><button class="btn" id="nx">'+(i+1<n?'Client suivant':'Voir mon résultat')+'</button></div>';
    gm.querySelectorAll(".money button, #cl, #ok").forEach(b => b.disabled = true);
    const nx = document.getElementById("nx"); nx.focus(); nx.onclick = () => { i++; next(); };
  }
  function recap(){ const bad = log.filter(x => !x.ok); if(!bad.length) return ''; return '<div class="recap"><h3>À revoir</h3>'+bad.map(x => '<p>Ticket '+euro(x.cl.t)+', donné '+euro(x.cl.g)+' → monnaie : <strong>'+euro(x.cl.g-x.cl.t)+'</strong></p>').join('')+'</div>'; }
}

/* ---------- Le rayon à remplir ---------- */
function gRayon(exo, comp){
  const R = exo.game.rounds; let r = 0, score = 0, place = {}, sel = null, checked = false; const total = R.reduce((s,x) => s+x.items.length, 0);
  const {gm, hud} = shell(exo, comp);
  intro(gm, "Le rayon à remplir", '<p>Touche un produit, puis touche l\'étagère où tu veux le placer. Pour le reprendre, touche-le à nouveau.</p><p>Quand tout est placé, vérifie ton rayon.</p>', () => draw());
  function draw(){
    const rd = R[r];
    hud.innerHTML = '<span>Manche '+(r+1)+' / '+R.length+'</span><span>✔ '+score+' / '+total+'</span>';
    const tray = rd.items.map((it,k) => place[k] === undefined ? '<button class="prod'+(sel===k?' sel':'')+'" data-k="'+k+'">'+it.em+' '+it.n+'</button>' : '').join('');
    let h = '<div class="card"><h2>'+rd.title+'</h2><p>'+rd.cons+'</p><div class="shelf">';
    rd.levels.forEach((l,li) => {
      h += '<div class="lvl" data-l="'+li+'"><span class="lvlname">'+l+'</span><div class="slot">'+
        rd.items.map((it,k) => place[k] === li ? '<button class="prod placed'+(checked?(it.ok.includes(li)?' good':' bad'):'')+'" data-p="'+k+'">'+it.em+' '+it.n+'</button>' : '').join('')+'</div></div>';
    });
    h += '</div>';
    if(!checked) h += '<p class="hint">Produits à placer :</p><div class="tray2">'+(tray || '<span class="muted">Tout est placé !</span>')+'</div><div style="text-align:right;margin-top:12px"><button class="btn" id="vf"'+(Object.keys(place).length<rd.items.length?' disabled':'')+'>Vérifier mon rayon</button></div>';
    else {
      h += '<div class="recap">'+rd.items.map((it,k) => '<p>'+(it.ok.includes(place[k])?'✔':'✘')+' <strong>'+it.n+'</strong> : '+it.e+'</p>').join('')+'</div>'+
        '<div style="text-align:right;margin-top:12px"><button class="btn" id="nx">'+(r+1<R.length?'Manche suivante':'Voir mon résultat')+'</button></div>';
    }
    h += '</div>'; gm.innerHTML = h;
    if(!checked){
      gm.querySelectorAll(".tray2 .prod").forEach(b => b.onclick = () => { sel = +b.dataset.k; draw(); });
      gm.querySelectorAll(".prod.placed").forEach(b => b.onclick = e => { e.stopPropagation(); delete place[+b.dataset.p]; draw(); });
      gm.querySelectorAll(".lvl").forEach(l => l.onclick = () => { if(sel === null) return; place[sel] = +l.dataset.l; sel = null; draw(); });
      document.getElementById("vf").onclick = () => { checked = true; rd.items.forEach((it,k) => { if(it.ok.includes(place[k])) score++; }); draw(); };
    } else {
      document.getElementById("nx").onclick = () => { if(r+1 < R.length){ r++; place = {}; sel = null; checked = false; draw(); } else viewResult(exo, comp, score, total, ''); };
    }
  }
}

/* ---------- Le tapis des dates ---------- */
function gTapis(exo, comp){
  const cfg = exo.game, items = cfg.items, n = items.length, O = ["Je garde","Je démarque","Je retire"]; let i = 0, score = 0, left = 0, done = false; const errs = [];
  const {gm, hud} = shell(exo, comp);
  intro(gm, "Le tapis des dates", '<p><strong>'+cfg.today+'</strong>. Les produits défilent : décide vite !</p><ul class="list"><li><strong>DLC dépassée</strong> ou emballage abîmé → <strong>je retire</strong></li><li><strong>DLC aujourd\'hui ou demain</strong> → <strong>je démarque</strong> (prix réduit)</li><li><strong>DDM dépassée</strong> → <strong>je démarque</strong> (il peut encore être vendu)</li><li>Sinon → <strong>je garde</strong></li></ul><p>Le tapis accélère au fil du jeu.</p>', () => next());
  function next(){
    stopAll(); if(i >= n) return viewResult(exo, comp, score, n, errs.length ? '<div class="recap"><h3>À revoir</h3>'+errs.map(x => '<p><strong>'+x.n+'</strong> ('+x.info+') → '+O[x.a]+'. '+x.e+'</p>').join('')+'</div>' : '');
    const it = items[i], sec = i < 5 ? 8 : i < 10 ? 6 : 4; done = false; left = sec*10;
    hud.innerHTML = '<span>Produit '+(i+1)+' / '+n+'</span><span>Vitesse '+(i<5?'🐢':i<10?'🐇':'🚀')+'</span><span>✔ '+score+'</span>';
    gm.innerHTML = '<div class="card"><div class="belt"><div class="item"><span class="big">'+it.em+'</span><strong>'+it.n+'</strong><span>'+it.info+'</span></div></div><div class="timer"><div id="tm"></div></div>'+
      '<div class="opts tapis">'+O.map((o,k) => '<button class="opt" data-k="'+k+'">'+o+'</button>').join('')+'</div><div id="fb"></div></div>';
    gm.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
    const tot = left, bar = document.getElementById("tm");
    GT = setInterval(() => { left--; bar.style.width = (left/tot*100)+"%"; if(left <= 0){ stopAll(); answer(null); } }, 100);
  }
  function answer(k){
    if(done) return; done = true; stopAll();
    const it = items[i], ok = k === it.a; if(ok) score++; else errs.push(it);
    gm.querySelectorAll(".opt").forEach(b => { b.disabled = true; const bk = +b.dataset.k; if(bk === it.a) b.classList.add("good"); else if(bk === k) b.classList.add("bad"); });
    document.getElementById("fb").innerHTML = '<div class="fb '+(ok?'ok':'ko')+'"><strong>'+(ok?'✔ Bien vu !':(k===null?'⏱️ Trop lent !':'✘ Raté !')+' → '+O[it.a])+'</strong>'+it.e+'</div>';
    GTO = setTimeout(() => { i++; next(); }, ok ? 1300 : 2600);
  }
}

/* ---------- La chasse aux anomalies ---------- */
function gChasse(exo, comp){
  const cfg = exo.game, ids = Object.keys(cfg.anom), total = ids.length; let found = {}, miss = 0, left = cfg.time*10, over = false;
  const {gm, hud} = shell(exo, comp);
  intro(gm, "La chasse aux anomalies", '<p>'+cfg.intro+'</p><p>Il y a <strong>'+total+' anomalies</strong> à trouver en '+cfg.time+' secondes. Chaque clic au mauvais endroit te coûte des points !</p>', start);
  function cell(t, k){ return '<button class="hot'+(k&&found[k]?' found':'')+'" data-k="'+(k||'')+'">'+t+'</button>'; }
  function start(){
    let h = '<div class="card">'+(cfg.ref||'')+'<h3>'+cfg.title+'</h3>';
    if(cfg.table){ h += '<div class="tablewrap"><table class="doc hunt"><tr>'+cfg.table.head.map(x => '<th>'+x+'</th>').join('')+'</tr>'+cfg.table.rows.map(r => '<tr>'+r.map(c => '<td>'+cell(c.t,c.k)+'</td>').join('')+'</tr>').join('')+'</table></div>'; }
    if(cfg.cards){ h += '<div class="labels">'+cfg.cards.map(c => '<button class="hot label" data-k="'+(c.k||'')+'">'+c.lines.join('<br>')+'</button>').join('')+'</div>'; }
    h += '<div id="toast"></div><div style="text-align:right;margin-top:12px"><button class="btn ghost" id="end">J\'ai fini</button></div></div>';
    gm.innerHTML = h;
    gm.querySelectorAll(".hot").forEach(b => b.onclick = () => {
      if(over) return; const k = b.dataset.k, t = document.getElementById("toast");
      if(k){ if(found[k]) return; found[k] = true; gm.querySelectorAll('.hot[data-k="'+k+'"]').forEach(x => x.classList.add("found")); t.innerHTML = '<div class="fb ok"><strong>✔ Anomalie trouvée !</strong>'+cfg.anom[k]+'</div>'; hudDraw(); if(Object.keys(found).length === total) end(); }
      else { miss++; b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 500); t.innerHTML = '<div class="fb ko"><strong>✘ Rien d\'anormal ici.</strong></div>'; hudDraw(); }
    });
    document.getElementById("end").onclick = end;
    hudDraw();
    GT = setInterval(() => { left--; hudDraw(); if(left <= 0) end(); }, 100);
  }
  function hudDraw(){ hud.innerHTML = '<span>⏱️ '+Math.ceil(left/10)+' s</span><span>🔍 '+Object.keys(found).length+' / '+total+'</span><span>✘ '+miss+' clics ratés</span>'; }
  function end(){
    if(over) return; over = true; stopAll();
    const f = Object.keys(found).length, score = Math.max(0, f - Math.floor(miss/2));
    viewResult(exo, comp, score, total, '<div class="recap"><h3>Les anomalies</h3>'+ids.map(k => '<p>'+(found[k]?'✔':'✘ <em>non trouvée</em> :')+' '+cfg.anom[k]+'</p>').join('')+(miss>=2?'<p class="muted">'+miss+' clics ratés : −'+Math.floor(miss/2)+' point(s).</p>':'')+'</div>');
  }
}

/* ---------- Le client mystère ---------- */
function gClient(exo, comp){
  const cfg = exo.game, N = cfg.nodes.length; let i = 0, gauge = 50, best = 0, chat = [];
  const {gm, hud} = shell(exo, comp);
  intro(gm, "Le client mystère", '<p>'+cfg.intro+'</p><p>Choisis tes réponses : la jauge de satisfaction du client monte ou descend selon ce que tu dis. Plusieurs fins sont possibles !</p>', () => { push(i); draw(); });
  function push(k){ const nd = cfg.nodes[k]; chat.push(nd.narr ? {w:"narr", t:nd.narr} : {w:"cli", t:nd.say}); }
  function face(){ return gauge >= 75 ? "😄" : gauge >= 50 ? "🙂" : gauge >= 30 ? "😐" : "😠"; }
  function draw(fbk){
    hud.innerHTML = '<span>'+cfg.avatar+' '+cfg.name+'</span><span class="gauge"><span style="width:'+gauge+'%"></span></span><span>'+face()+' '+gauge+' %</span>';
    let h = '<div class="card"><div class="chat">'+chat.map(m => '<div class="msg '+m.w+'">'+m.t+'</div>').join('')+'</div>';
    if(fbk) h += '<div class="fb '+(fbk.d>0?'ok':'ko')+'"><strong>'+(fbk.d>0?'+':'')+fbk.d+' '+(fbk.d>0?'😊':'😕')+'</strong>'+fbk.fb+'</div>';
    if(i < N) h += '<p class="hint">Que fais-tu ou que dis-tu ?</p><div class="opts">'+cfg.nodes[i].sh.map((c,k) => '<button class="opt" data-k="'+k+'">'+c.t+'</button>').join('')+'</div>';
    else { const end = cfg.ends.find(e => gauge >= e.min); h += '<div class="ending"><h3>'+end.title+'</h3><p>'+end.text+'</p></div><div style="text-align:right"><button class="btn" id="nx">Voir mon résultat</button></div>'; }
    h += '</div>'; gm.innerHTML = h;
    const ch = gm.querySelector(".chat"); ch.scrollTop = ch.scrollHeight;
    if(i < N) gm.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(cfg.nodes[i].sh[+b.dataset.k]));
    else document.getElementById("nx").onclick = () => { const end = cfg.ends.find(e => gauge >= e.min); viewResult(exo, comp, best, N, '<div class="ending"><h3>'+end.title+'</h3><p>'+end.text+'</p><p class="muted">Satisfaction finale : '+gauge+' %</p></div>'); };
  }
  function choose(c){
    const nd = cfg.nodes[i], mx = Math.max(...nd.c.map(x => x.d));
    if(c.d === mx) best++;
    gauge = Math.max(0, Math.min(100, gauge + c.d));
    chat.push({w:"me", t:c.t}); i++; if(i < N) push(i);
    draw(c);
  }
  cfg.nodes.forEach(nd => nd.sh = shuffle(nd.c));
}

/* ---------- Le memory ---------- */
function gMemory(exo, comp){
  const P = exo.game.pairs; let cards = [], open = [], found = 0, errs = 0, lock = false, t0 = 0;
  const {gm, hud} = shell(exo, comp);
  intro(gm, "Le memory du vocabulaire", '<p>Retourne les cartes deux par deux pour retrouver chaque <strong>mot</strong> et sa <strong>définition</strong>. Le moins d\'erreurs possible !</p>', start);
  function start(){
    cards = shuffle(P.flatMap((p,k) => [{k, t:p[0], s:"term"}, {k, t:p[1], s:"def"}])); t0 = Date.now();
    gm.innerHTML = '<div class="mem">'+cards.map((c,j) => '<button class="mcard" data-j="'+j+'"><span class="back">?</span><span class="front '+c.s+'">'+c.t+'</span></button>').join('')+'</div>';
    gm.querySelectorAll(".mcard").forEach(b => b.onclick = () => flip(+b.dataset.j, b));
    hudDraw();
  }
  function hudDraw(){ hud.innerHTML = '<span>Paires : '+found+' / '+P.length+'</span><span>Erreurs : '+errs+'</span>'; }
  function flip(j, b){
    if(lock || b.classList.contains("on") || b.classList.contains("done")) return;
    b.classList.add("on"); open.push([j,b]);
    if(open.length < 2) return;
    const [[j1,b1],[j2,b2]] = open; open = [];
    if(cards[j1].k === cards[j2].k){ b1.classList.add("done"); b2.classList.add("done"); found++; hudDraw();
      if(found === P.length){ const sec = Math.round((Date.now()-t0)/1000), score = Math.max(2, P.length - Math.max(0, Math.ceil((errs-3)/2)));
        GTO = setTimeout(() => viewResult(exo, comp, score, P.length, '<p class="muted">'+errs+' erreur(s) en '+sec+' secondes. Jusqu\'à 3 erreurs, c\'est le score maximum !</p>'), 700); }
    } else { errs++; hudDraw(); lock = true; GTO = setTimeout(() => { b1.classList.remove("on"); b2.classList.remove("on"); lock = false; }, 1000); }
  }
}

ADD("3.2", { id:"3.2-g", icon:"🎭", title:"Le client mystère : l'accueil", kind:"Jeu", min:4, game:{ type:"client", name:"Mme Roche", avatar:"👩‍🦳",

ADD("3.3", { id:"3.3-g", icon:"🎭", title:"Le client mystère : le conseil", kind:"Jeu", min:5, game:{ type:"client", name:"M. Petit", avatar:"🧔",
  intro:"Tu es vendeur ou vendeuse au rayon running du « Vestiaire ». Un client arrive : découvre son besoin et conseille-le jusqu'au bout.",
  nodes:[
    {say:"« Bonjour, je voudrais des chaussures de course. »", c:[
      {t:"« Bonjour Monsieur ! Vous courez plutôt sur route ou en forêt, et à quel rythme ? »", d:20, fb:"Des questions ouvertes pour découvrir le besoin."},
      {t:"« Elles sont au fond du magasin, à gauche. »", d:-15, fb:"Tu l'orientes, mais tu ne le conseilles pas."},
      {t:"« Prenez celles-ci : ce sont les plus chères, donc les meilleures. »", d:-20, fb:"Tu proposes un produit sans connaître son besoin."}]},
    {say:"« Sur route, trois fois par semaine. Depuis quelque temps, j'ai un peu mal aux genoux. »", c:[
      {t:"« Je vais vous montrer des modèles avec un bon amorti, pour protéger vos genoux. »", d:20, fb:"Tu as repéré ses mobiles : confort et sécurité."},
      {t:"« Ces chaussures sont en promotion cette semaine. »", d:-5, fb:"Tu ne réponds pas à son problème de genoux."},
      {t:"« Il faudrait voir un médecin, je ne peux rien pour vous. »", d:-10, fb:"Tu peux l'aider avec un produit adapté, tout en restant prudent(e)."}]},
    {say:"« Celles-ci me plaisent, mais 120 €, c'est un peu cher… »", c:[
      {t:"« Elles ont un amorti renforcé : vos genoux seront moins sollicités. Essayez-les sur notre tapis de course, vous sentirez la différence. »", d:20, fb:"Caractéristique, avantage, preuve : un vrai argument CAP."},
      {t:"« C'est le prix. »", d:-20, fb:"L'objection n'est pas traitée."},
      {t:"« Ce modèle à 60 € coûte moins cher, mais il n'est pas fait pour la route. »", d:-10, fb:"Moins cher, mais inadapté à son besoin."}]},
    {say:"Il les essaie : « Elles sont très confortables, je les prends ! »", c:[
      {t:"« Excellent choix ! Des chaussettes techniques évitent les ampoules : je vous en montre une paire ? »", d:20, fb:"Une vente additionnelle utile, liée à son achat."},
      {t:"« La caisse est par là. »", d:0, fb:"Correct, mais tu passes à côté d'un conseil utile."},
      {t:"« Prenez aussi la montre GPS à 300 €, tout le monde l'a. »", d:-15, fb:"Forcer une vente coûteuse sans lien avec son besoin agace le client."}]},
    {say:"« Et si la taille ne va pas, je n'aurai pas le temps de revenir… »", c:[
      {t:"« Vous avez 30 jours pour les échanger avec votre ticket, dans n'importe lequel de nos magasins. »", d:20, fb:"Tu rassures avec un service précis."},
      {t:"« Je ne sais pas trop. »", d:-10, fb:"Le client repart avec un doute."},
      {t:"« Ce n'est pas mon problème. »", d:-20, fb:"Une réponse qui fait fuir le client."}]}
  ],
  ends:ENDS("M. Petit repart avec ses chaussures et ses chaussettes, et il reviendra demander conseil pour sa prochaine course.","M. Petit achète les chaussures, mais tu aurais pu mieux le conseiller.","M. Petit repart sans rien acheter : il commandera sur internet.")
}});
ADD("3.5", { id:"3.5-g", icon:"🎭", title:"Le client mystère : la réclamation", kind:"Jeu", min:5, game:{ type:"client", name:"M. Garcia", avatar:"👨",
  intro:"Tu es à l'accueil de « Brico Plus ». Un client mécontent arrive : garde ton calme et transforme sa colère en satisfaction.",
